# Publishes to quay.io/mayamtahhan:
#   helpdesk-email-gateway, helpdesk-triage-ui, helpdesk-inference-mock
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   REDHAT_REGISTRY_USERNAME — Quay robot, e.g. mayamtahhan+github-helpdesk-triage
#   REDHAT_REGISTRY_PASSWORD — robot token (not your personal Quay password)
#
# Create the three public repos under the mayamtahhan namespace on quay.io and
# grant the robot Write access before the first run.

name: Publish container images to Quay.io

on:
  push:
    branches:
      - main
      - container/**
    paths:
      - "email-gateway/**"
      - "agent-dashboard/**"
      - "inference-mock/**"
      - ".github/workflows/publish-quay.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "email-gateway/**"
      - "agent-dashboard/**"
      - "inference-mock/**"
      - ".github/workflows/publish-quay.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  IMAGE_REGISTRY: quay.io
  IMAGE_NAMESPACE: mayamtahhan
  IMAGE_TAG: latest

jobs:
  test:
    name: Tests before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: make test

      - name: Run webhook sink e2e
        run: make test-webhook

  build-and-push:
    name: ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: helpdesk-email-gateway
            context: email-gateway
            smoke_test: python -c "import app.main"
          - image: helpdesk-triage-ui
            context: agent-dashboard
            smoke_test: python -c "import streamlit"
          - image: helpdesk-inference-mock
            context: inference-mock
            smoke_test: python -c "import server"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=${{ env.IMAGE_TAG }}-{{sha}}
            type=raw,value=${{ env.IMAGE_TAG }}-{{date 'YYYYMMDD'}}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          load: true

      - name: Test container image
        run: |
          IMAGE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          docker run --rm "$IMAGE" ${{ matrix.smoke_test }}

      - name: Push container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Display image info
        if: github.event_name != 'pull_request'
        run: |
          echo "Container image pushed successfully."
          echo ""
          echo "Image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          echo ""
          echo "Additional tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  - /'

  scan:
    name: Trivy — ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - helpdesk-email-gateway
          - helpdesk-triage-ui
          - helpdesk-inference-mock
    steps:
      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

