# Publishes to quay.io/mayamtahhan:
#   helpdesk-email-gateway, helpdesk-triage-ui, helpdesk-inference-mock
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   QUAY_USERNAME  — robot account, e.g. mayamtahhan+github-helpdesk-triage
#   QUAY_PASSWORD  — robot token (not your personal Quay password)
#
# Create the three public repos under the mayamtahhan namespace on quay.io and
# grant the robot Write access before the first run.

name: Publish container images to Quay.io

on:
  push:
    branches: [main]
    paths:
      - "email-gateway/**"
      - "agent-dashboard/**"
      - "inference-mock/**"
      - ".github/workflows/publish-quay.yml"
  workflow_dispatch:
  release:
    types: [published]

env:
  QUAY_REGISTRY: quay.io
  QUAY_NAMESPACE: mayamtahhan

jobs:
  build-and-push:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: helpdesk-email-gateway
            context: email-gateway
          - image: helpdesk-triage-ui
            context: agent-dashboard
          - image: helpdesk-inference-mock
            context: inference-mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.QUAY_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.QUAY_REGISTRY }}/${{ env.QUAY_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
