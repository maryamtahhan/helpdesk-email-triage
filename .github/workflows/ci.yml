name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit and webhook tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: make test

      - name: Run webhook sink e2e
        run: make test-webhook

  compose-config:
    name: Validate Compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check compose.mock.demo.yml
        run: docker compose -f compose.mock.demo.yml config > /dev/null

      - name: Check compose.gateway-only.yml
        run: docker compose -f compose.gateway-only.yml config > /dev/null

      - name: Check compose.yml
        run: docker compose -f compose.yml config > /dev/null

  validate-manifests:
    name: Validate OpenShift manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Validate Kustomize overlays
        run: make validate-manifests

  build-containers:
    name: Build container smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: email-gateway
            smoke_test: python -c "import app.main"
          - context: agent-dashboard
            smoke_test: python -c "import streamlit"
          - context: inference-mock
            smoke_test: python -c "import server"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f "${{ matrix.context }}/Containerfile" -t "local/${{ matrix.context }}:ci" "${{ matrix.context }}"

      - name: Smoke test
        run: docker run --rm "local/${{ matrix.context }}:ci" ${{ matrix.smoke_test }}

  compose-e2e:
    name: Compose end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run compose e2e
        run: make compose-e2e
