version: "3.8"

# Laptop / demo stack. Replaces Red Hat AI Inference with a local OpenAI-compatible
# mock so the email pipeline and dashboard can be exercised without GPUs or
# registry.redhat.io access.
#
#   podman compose -f compose.mock.demo.yml up --build
#   # or: docker compose -f compose.mock.demo.yml up --build
#
# Images default to quay.io/mayamtahhan/helpdesk-*:latest (see .env.example).
# Use --build to rebuild locally; podman compose pull to fetch from Quay.

services:
  rhaii-cpu-engine:
    build:
      context: ./inference-mock
    image: ${MOCK_IMAGE:-quay.io/mayamtahhan/helpdesk-inference-mock:latest}
    container_name: rhaii-cpu-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  email-gateway:
    build:
      context: ./email-gateway
    image: ${GATEWAY_IMAGE:-quay.io/mayamtahhan/helpdesk-email-gateway:latest}
    container_name: rhaii-email-gateway
    restart: unless-stopped
    depends_on:
      rhaii-cpu-engine:
        condition: service_healthy
    ports:
      - "3025:3025"
      - "8080:8080"
    environment:
      VLLM_BASE_URL: http://rhaii-cpu-engine:8000/v1
      VLLM_ENDPOINT: http://rhaii-cpu-engine:8000/v1/chat/completions
      MODEL_NAME: mock-triage
      GATEWAY_MODE: ${GATEWAY_MODE:-FILE_WATCHER}
      EMAIL_INPUT_DIR: /app/input_emails
      TICKET_DATA_DIR: /app/data
      SMTP_BIND: "0.0.0.0"
      VAULT_SECRET: ${VAULT_SECRET:-helpdesk-demo-secret}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:8501}
    volumes:
      - ./sample_emails:/app/input_emails:Z
      - gateway-data:/app/data:Z

  agent-dashboard-ui:
    build:
      context: ./agent-dashboard
    image: ${UI_IMAGE:-quay.io/mayamtahhan/helpdesk-triage-ui:latest}
    container_name: rhaii-triage-ui
    restart: unless-stopped
    depends_on:
      - email-gateway
    ports:
      - "8501:8501"
    environment:
      GATEWAY_URL: http://email-gateway:8080
      SMTP_HOST: email-gateway
      VAULT_SECRET: ${VAULT_SECRET:-helpdesk-demo-secret}
    volumes:
      - ./docs:/app/docs:ro,Z

volumes:
  gateway-data:
