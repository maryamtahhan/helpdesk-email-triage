apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production-oriented overlay with RHAII CPU inference.
# Set VAULT_SECRET and INGEST_API_KEY in helpdesk-secrets before deploying.
namespace: helpdesk-email-triage

resources:
  - ../helpdesk-email-triage-rhaii

patches:
  - path: ../../components/hardening/patch-require-secrets.yaml
  - path: ../../components/hardening/patch-route-dashboard-oauth.yaml
  - path: ../../components/hardening/patch-route-gateway-oauth.yaml
  - path: ../../components/hardening/patch-dashboard-scope-secrets.yaml
