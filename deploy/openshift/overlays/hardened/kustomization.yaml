apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production-oriented overlay: network policies, OAuth on the dashboard Route,
# and REQUIRE_SECRETS=1 (set VAULT_SECRET and INGEST_API_KEY in helpdesk-secrets
# before deploying — see docs/deploy-openshift.md).
namespace: helpdesk-email-triage

resources:
  - ../helpdesk-email-triage

patches:
  - path: ../../components/hardening/patch-require-secrets.yaml
  - path: ../../components/hardening/patch-route-dashboard-oauth.yaml
