apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production-oriented overlay (mock inference): network policies, OAuth on the
# dashboard Route, and REQUIRE_SECRETS=1. For RHAII CPU use hardened-rhaii
# or INFERENCE=rhaii with OVERLAY=deploy/openshift/overlays/hardened.
namespace: helpdesk-email-triage

resources:
  - ../helpdesk-email-triage

patches:
  - path: ../../components/hardening/patch-require-secrets.yaml
  - path: ../../components/hardening/patch-route-dashboard-oauth.yaml
  - path: ../../components/hardening/patch-route-gateway-oauth.yaml
  - path: ../../components/hardening/patch-dashboard-scope-secrets.yaml
