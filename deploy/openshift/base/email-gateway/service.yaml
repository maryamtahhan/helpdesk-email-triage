apiVersion: v1
kind: Service
metadata:
  name: email-gateway
  labels:
    app.kubernetes.io/name: email-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: helpdesk-email-triage
spec:
  selector:
    app.kubernetes.io/name: email-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: smtp
      port: 3025
      targetPort: smtp
