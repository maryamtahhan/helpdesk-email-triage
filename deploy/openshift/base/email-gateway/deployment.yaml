apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-gateway
  labels:
    app.kubernetes.io/name: email-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: helpdesk-email-triage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: email-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: helpdesk-email-triage
    spec:
      serviceAccountName: helpdesk-route-reader
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-inference
          image: quay.io/mtahhan/helpdesk-email-gateway:latest
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import os
              import time
              import urllib.request
              base = os.environ["VLLM_BASE_URL"].rstrip("/")
              url = f"{base}/models"
              for _ in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=3)
                      break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit("inference endpoint not ready")
          envFrom:
            - configMapRef:
                name: helpdesk-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
      containers:
        - name: email-gateway
          image: quay.io/mtahhan/helpdesk-email-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: smtp
              containerPort: 3025
              protocol: TCP
          envFrom:
            - configMapRef:
                name: helpdesk-config
            - secretRef:
                name: helpdesk-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: gateway-data
              mountPath: /app/data
            - name: sample-emails
              mountPath: /app/input_emails
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-data
        - name: sample-emails
          configMap:
            name: sample-emails
            optional: true
