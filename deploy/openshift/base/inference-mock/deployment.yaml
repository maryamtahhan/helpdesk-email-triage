apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-mock
  labels:
    app.kubernetes.io/name: inference-mock
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: helpdesk-email-triage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-mock
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: helpdesk-email-triage
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference-mock
          image: quay.io/mtahhan/helpdesk-inference-mock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
