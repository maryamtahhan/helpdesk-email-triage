# Dashboard only needs INGEST_API_KEY for gateway calls — not VAULT_SECRET.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-dashboard
spec:
  template:
    spec:
      containers:
        - name: agent-dashboard
          envFrom:
            - configMapRef:
                name: helpdesk-config
          env:
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: helpdesk-secrets
                  key: INGEST_API_KEY
                  optional: true
