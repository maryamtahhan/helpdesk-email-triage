# Red Hat AI Inference 3.5 CPU — matches compose.yml / deploy/quadlet/rhaii-cpu-engine.container.
# Requires hf-secret (HF_TOKEN) and redhat-registry-pull (registry.redhat.io) in the namespace.
# See docs/deploy-openshift.md and RHAII 3.5 CPU on OpenShift (standalone container guide).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhaii-cpu
  labels:
    app.kubernetes.io/name: rhaii-cpu
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: helpdesk-email-triage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rhaii-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhaii-cpu
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: helpdesk-email-triage
    spec:
      imagePullSecrets:
        - name: redhat-registry-pull
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: rhaii-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      containers:
        - name: rhaii-cpu
          image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.5.0-1786546771
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: HF_TOKEN
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "8"
            - name: LD_PRELOAD
              value: /usr/lib64/libomp.so
          args:
            - --model
            - Qwen/Qwen2.5-1.5B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          volumeMounts:
            - name: model-cache
              mountPath: /opt/app-root/src/.cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
