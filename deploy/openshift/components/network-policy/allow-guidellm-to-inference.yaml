# Lets an in-cluster GuideLLM benchmark Job reach inference (see scripts/guidellm-openshift.sh).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-guidellm-to-inference
  labels:
    app.kubernetes.io/part-of: helpdesk-email-triage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rhaii-cpu
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: guidellm-benchmark
      ports:
        - protocol: TCP
          port: 8000
